<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Misa AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <span class="brand">MISA</span>
            <span class="status">
                <i class="online-dot"></i>
                <span id="connection-status">Connecting...</span>
            </span>
        </header>

        <section class="orb-stage" aria-label="Misa voice visualizer">
            <div id="orb" class="orb" data-state="idle">
                <span class="orb-ring ring-one"></span>
                <span class="orb-ring ring-two"></span>
                <canvas id="orb-canvas"></canvas>
                <span class="orb-core"></span>
            </div>
        </section>

        <section id="chat" class="chat" aria-live="polite"
                 aria-label="Conversation with Misa"></section>

        <section class="controls">
            <p id="assistant-status" class="assistant-status">Ask me anything</p>

            <form id="composer" class="composer">
                <input id="message" type="text" placeholder="Type here ..."
                       autocomplete="off" aria-label="Message">

                <button id="microphone" class="icon-button" type="button"
                        aria-label="Mute microphone" title="Mute microphone">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/>
                    </svg>
                </button>

                <button id="send" class="icon-button" type="submit" disabled
                        aria-label="Send message" title="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3.4 20.4 17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.95.95 0 0 0-1.3 1.05L3.5 10l10 2-10 2-1.4 5.35a.95.95 0 0 0 1.3 1.05Z"/>
                    </svg>
                </button>

                <button id="clear-chat" class="icon-button" type="button"
                        aria-label="Clear conversation" title="Clear conversation">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2a10 10 0 1 0 9.8 8h-2.06A8 8 0 1 1 17.66 6.34L14 10h8V2l-2.92 2.92A9.94 9.94 0 0 0 12 2Z"/>
                    </svg>
                </button>
            </form>
        </section>
    </main>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        const chat = document.getElementById("chat");
        const composer = document.getElementById("composer");
        const messageInput = document.getElementById("message");
        const sendButton = document.getElementById("send");
        const microphoneButton = document.getElementById("microphone");
        const clearButton = document.getElementById("clear-chat");
        const connectionStatus = document.getElementById("connection-status");
        const assistantStatus = document.getElementById("assistant-status");
        const orb = document.getElementById("orb");
        const canvas = document.getElementById("orb-canvas");
        const context = canvas.getContext("2d");

        let misaBridge = null;
        let currentState = "idle";
        let isMuted = false;

        const particles = Array.from({length: 220}, () => ({
            angle: Math.random() * Math.PI * 2,
            radius: Math.sqrt(Math.random()),
            speed: 0.0015 + Math.random() * 0.004,
            size: 0.45 + Math.random() * 1.35,
            alpha: 0.25 + Math.random() * 0.75,
        }));

        function resizeCanvas() {
            const size = Math.max(1, orb.clientWidth);
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = size * ratio;
            canvas.height = size * ratio;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function drawOrb(time) {
            const size = orb.clientWidth;
            const center = size / 2;
            const radius = size * 0.265;
            const active = currentState === "speaking" || currentState === "listening";
            const pulse = active ? 1 + Math.sin(time * 0.006) * 0.045 : 1;
            const speedMultiplier = currentState === "speaking" ? 2.2 : 1;

            context.clearRect(0, 0, size, size);
            orb.style.setProperty("--audio-level", currentState === "speaking" ? "0.35" : "0");

            for (const particle of particles) {
                particle.angle += particle.speed * speedMultiplier;
                const drift = Math.sin(time * 0.0015 + particle.angle * 3) * 2.2;
                const distance = particle.radius * radius * pulse + drift;
                const x = center + Math.cos(particle.angle) * distance;
                const y = center + Math.sin(particle.angle) * distance;

                context.beginPath();
                context.arc(x, y, particle.size * pulse, 0, Math.PI * 2);
                context.fillStyle = `rgba(43,117,255,${particle.alpha})`;
                context.shadowColor = "#1462ff";
                context.shadowBlur = 5;
                context.fill();
            }

            requestAnimationFrame(drawOrb);
        }

        function setOrbState(state, text) {
            currentState = state;
            orb.dataset.state = state;
            assistantStatus.textContent = text;
        }

        function addMessage(sender, text) {
            if (!text) return;
            chat.classList.add("has-messages");

            const article = document.createElement("article");
            const bubble = document.createElement("div");
            article.className = `message ${sender}`;
            bubble.className = "bubble";
            bubble.textContent = text;
            article.appendChild(bubble);
            chat.appendChild(article);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateComposer() {
            const ready = Boolean(misaBridge);
            messageInput.disabled = !ready;
            microphoneButton.disabled = !ready;
            sendButton.disabled = !ready || !messageInput.value.trim();
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !misaBridge) return;

            addMessage("user", text);
            messageInput.value = "";
            setOrbState("thinking", "Misa is thinking...");
            updateComposer();
            misaBridge.sendText(text);
            messageInput.focus();
        }

        function applyRuntimeState(state) {
            const normalized = String(state || "idle").toLowerCase();
            const labels = {
                initialising: "Starting Misa...",
                listening: "Ask me anything",
                thinking: "Misa is thinking...",
                processing: "Processing...",
                speaking: "Misa is speaking...",
                muted: "Microphone muted",
            };
            setOrbState(normalized, labels[normalized] || "Ask me anything");
        }

        function applyMutedState(muted) {
            isMuted = Boolean(muted);
            microphoneButton.classList.toggle("muted", isMuted);
            microphoneButton.title = isMuted ? "Unmute microphone" : "Mute microphone";
            microphoneButton.setAttribute(
                "aria-label",
                isMuted ? "Unmute microphone" : "Mute microphone"
            );
            applyRuntimeState(isMuted ? "muted" : "listening");
        }

        function connectQtBridge() {
            if (typeof qt === "undefined" || typeof QWebChannel === "undefined") {
                connectionStatus.textContent = "Bridge unavailable";
                updateComposer();
                return;
            }

            new QWebChannel(qt.webChannelTransport, channel => {
                misaBridge = channel.objects.misa;
                connectionStatus.textContent = "Online";
                misaBridge.messageAdded.connect((role, text) => addMessage(role, text));
                misaBridge.stateChanged.connect(applyRuntimeState);
                misaBridge.mutedChanged.connect(applyMutedState);
                applyMutedState(false);
                updateComposer();
                messageInput.focus();
            });
        }

        messageInput.addEventListener("input", updateComposer);

        composer.addEventListener("submit", event => {
            event.preventDefault();
            sendMessage();
        });

        microphoneButton.addEventListener("click", () => {
            if (misaBridge) misaBridge.toggleMute();
        });

        clearButton.addEventListener("click", () => {
            chat.replaceChildren();
            chat.classList.remove("has-messages");
            applyRuntimeState(isMuted ? "muted" : "listening");
            messageInput.focus();
        });

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        requestAnimationFrame(drawOrb);
        updateComposer();
        connectQtBridge();
    </script>
</body>
</html>

services:
  misa:
    image: misa-ai-core:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misa-ai
    network_mode: host
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    group_add:
      - ${AUDIO_GID:-29}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HOME: /tmp/misa-home
      PULSE_SERVER: unix:/tmp/pulse/native
      QT_X11_NO_MITSHM: "1"
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse/native
      - ./memory:/app/memory
      - ./config:/app/config
      - ./runtime:/app/runtime
    tmpfs:
      - /tmp/misa-home
    restart: "no"
    stdin_open: true
    tty: true
